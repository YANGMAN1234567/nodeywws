<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自然的呼吸 · Serenity of Nature</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: "Noto Serif SC", serif;
    color: #fff;
    background: linear-gradient(120deg, #4facfe 0%, #00f2fe 100%);
    overflow: hidden;
  }

  /* 背景动画 - 山川流动感 */
  .background {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    background: url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
    filter: brightness(80%) contrast(110%) saturate(110%);
    z-index: -1;
    animation: float 20s ease-in-out infinite alternate;
  }

  @keyframes float {
    from { transform: scale(1) translateY(0); }
    to { transform: scale(1.05) translateY(-10px); }
  }

  header {
    text-align: center;
    padding-top: 12vh;
  }

  h1 {
    font-size: 3em;
    letter-spacing: 4px;
    text-shadow: 0 0 15px rgba(255,255,255,0.7);
  }

  h2 {
    font-size: 1.5em;
    font-weight: 300;
    color: #e0f7fa;
    margin-top: -10px;
  }

  .content {
    max-width: 700px;
    margin: 10vh auto;
    text-align: center;
    line-height: 1.8em;
    font-size: 1.1em;
    background: rgba(0,0,0,0.3);
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 0 15px rgba(255,255,255,0.2);
  }

  .quote {
    font-style: italic;
    color: #b2ebf2;
  }

  footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: #b2ebf2;
    font-size: 0.9em;
  }
</style>
</head>

<body>
<div class="background"></div>

<header>
  <h1>自然的呼吸</h1>
  <h2>Serenity of Nature</h2>
</header>

<div class="content">
  <p>当风拂过树林，溪水轻吟，山的影子落在湖面上，时间在这里变得柔软。</p>
  <p>我们与自然共呼吸，聆听它的低语，感受它无声的力量。🌲</p>
  <p class="quote">“静下来，你会听见大地的心跳。”</p>
</div>

<footer>
  © 2025 自然的呼吸 ｜ 设计 by AI & 你 🌿
</footer>

</body>
</html>
